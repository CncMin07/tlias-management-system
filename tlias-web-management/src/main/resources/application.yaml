spring:
  application:
    name: tlias-web-management

  # 数据库连接信息
  # 账号密码一律从环境变量读取，不要写死在文件里（仓库是公开的）
  # 需要的环境变量：DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tlias}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小
      max-request-size: 100MB

#Mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启驼峰命名映射开关
    map-underscore-to-camel-case: true

logging:
  level:
    com.fallenleaves.mapper: debug
    org.mybatis: debug
    #配置事务管理日志级别
    org.springframework.jdbc.support.JdbcTransactionManager: debug

#阿里云 OSS 对象存储配置
#AccessKey 不写在配置文件里，代码中通过 EnvironmentVariableCredentialsProvider
#从环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 读取
aliyun:
  OSS:
    endPoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
    bucketName: ${OSS_BUCKET_NAME:}
    region: ${OSS_REGION:cn-shanghai}
